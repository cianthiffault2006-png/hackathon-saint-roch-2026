<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maillage mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,600..700,0..100;1,9..144,600..700,0..100&family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#15201b; --gris-fil:#4f5f58; --vert:#1f5f4a; --vert-fonce:#164536; --vert-pale:#e6f1ec;
  --brique:#b9460e; --brique-fonce:#8f360a; --brique-pale:#fbe9dc; --ocre:#e3b100;
  --papier:#f7f1e6; --lin:#efe7d8; --craie:#fffdf8; --trait:#d9cfbd; --fil:#1f5f4a;
  --couleur-commerce:#b9460e; --couleur-organisme:#0072b2; --couleur-citoyen:#7b3f9e; --couleur-lieu:#009e73; --couleur-evenement:#e3b100;
  --rayon:10px; --rayon-petit:6px; --rayon-pilule:999px;
  --police-titre:"Fraunces",Georgia,serif; --police:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,sans-serif;
  --couture:repeating-linear-gradient(90deg,var(--fil) 0 7px,transparent 7px 12px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--papier);color:var(--encre);font-family:var(--police);font-size:16px;line-height:1.5;
  background-image:
    linear-gradient(to right, rgba(31,95,74,.055) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(31,95,74,.055) 1px, transparent 1px);
  background-size:24px 24px;}
.screen{min-height:100dvh;max-width:560px;margin:0 auto;padding:18px 20px 24px;display:flex;flex-direction:column;justify-content:space-between}
.tampon{align-self:flex-start;display:inline-block;padding:3px 9px;border:2px solid var(--brique);border-radius:4px;color:var(--brique);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-4deg);background:transparent}
.marque{display:flex;align-items:center;gap:10px;margin:28px 0 4px}
.marque svg{display:block}
.logo{margin:0;font-family:var(--police-titre);font-weight:600;font-size:48px;line-height:1;letter-spacing:-.01em;color:var(--vert-fonce);font-variation-settings:"SOFT" 100,"opsz" 72}
.lieu{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gris-fil)}
.pitch{margin:0;font-family:var(--police-titre);font-style:italic;font-weight:600;font-size:22px;line-height:1.3;color:var(--encre);font-variation-settings:"SOFT" 100,"opsz" 20}
.couture{height:2px;margin:18px 0;background:var(--couture);border:0}
.consigne{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gris-fil)}
.btn{min-height:56px;border:0;border-radius:var(--rayon);padding:0 18px;font:inherit;font-size:18px;font-weight:700;cursor:pointer}
.btn-role{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:10px;background:var(--craie);color:var(--encre);border:1.5px solid var(--trait);text-align:left;box-shadow:inset 6px 0 0 var(--c)}
.btn-role small{margin-left:auto;font-weight:400;font-size:14px;color:var(--gris-fil)}
.forme{display:inline-grid;place-items:center;width:34px;height:34px}
.btn-lien{width:100%;margin-bottom:10px;background:transparent;color:var(--vert-fonce);border:2px solid var(--vert)}
.btn-primaire{width:100%;background:var(--brique);color:#fff}
.liens{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin-top:6px}
.liens a{color:var(--vert-fonce);font-weight:500;text-decoration:underline;text-decoration-style:dashed;text-underline-offset:4px;min-height:44px;display:inline-flex;align-items:center;font-size:15px}
</style></head><body>
<main class="screen">
 <div>
  <span class="tampon">Démo simulée</span>
  <div class="marque">
   <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="#1f5f4a" stroke-width="3" stroke-linecap="round"><path d="M8 26c0-9 6-14 12-14s12 5 12 14"/><path d="M4 18c0 9 6 14 12 14"/><path d="M36 18c0 9-6 14-12 14"/><circle cx="20" cy="12" r="2.2" fill="#b9460e" stroke="none"/></svg>
   <h1 class="logo">Maillage</h1>
  </div>
  <p class="lieu">Saint-Roch · Québec</p>
  <p class="pitch">Des projets communs entre voisins de Saint-Roch, à trois partenaires, sur la carte du quartier.</p>
  <hr class="couture">
 </div>
 <div>
  <p class="consigne">Vous êtes…</p>
  <button class="btn btn-role" style="--c:var(--couleur-commerce)"><span class="forme"><svg width="30" height="30" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#b9460e"/><g transform="translate(11 11) scale(0.75)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7"/><path d="M10 20v-4h4v4"/></g></svg></span>Commerçant<small>café, boutique, resto</small></button>
  <button class="btn btn-role" style="--c:var(--couleur-organisme)"><span class="forme"><svg width="30" height="30" viewBox="0 0 40 40"><rect x="3" y="3" width="34" height="34" rx="5" fill="#0072b2"/><g transform="translate(11 11) scale(0.75)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 14.2c.6-.2 1.3-.3 2-.3 2.2 0 4 1.8 4 4v2"/></g></svg></span>Organisme<small>OBNL, collectif, école</small></button>
  <button class="btn btn-role" style="--c:var(--couleur-citoyen)"><span class="forme"><svg width="30" height="30" viewBox="0 0 40 40"><polygon points="20,1.5 38.5,20 20,38.5 1.5,20" fill="#7b3f9e"/><g transform="translate(11 11) scale(0.75)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></g></svg></span>Citoyen<small>artiste, voisin, bénévole</small></button>
  <hr class="couture">
  <button class="btn btn-lien">Visite guidée</button>
  <button class="btn btn-lien">Explorer le quartier</button>
  <div class="liens"><a href="#">Proposer un projet</a><a href="#">Tableau SDC</a><a href="#">Sources</a></div>
 </div>
</main>
</body></html>
